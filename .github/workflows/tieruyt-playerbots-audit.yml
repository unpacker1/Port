name: TieruYT Playerbots ARM64 and WebClient audit

on:
  push:
    branches:
      - tieruyt-playerbots-arm64-web-audit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpp-policy-tests:
    name: C++ standalone tests / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Compile and run v2.2.16 policy tests
        run: python3 playerbots-lab/tools/run_cpp_tests.py --upstream playerbots-lab/upstream --report-dir reports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpp-results-${{ matrix.arch }}
          path: reports/cpp-tests-*.json
          if-no-files-found: warn

  client-mock-tests:
    name: Python client and shell test mocks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Run isolated client/migrator tests
        run: python3 playerbots-lab/tools/run_client_tests.py --upstream playerbots-lab/upstream --report-dir reports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-mock-results
          path: reports/client-mock-tests.json
          if-no-files-found: warn

  compatibility-audit:
    name: Read-only source and platform inventory
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Retrieve latest official public manifest
        run: curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/TieruYT/metin2-playerbots/main/update-manifest-mt2009.json --output current-manifest.json
      - name: Compile lab tooling
        run: python3 -m py_compile playerbots-lab/tools/audit.py playerbots-lab/tools/run_cpp_tests.py playerbots-lab/tools/run_client_tests.py
      - name: Scan pinned source and current platform contract
        run: python3 playerbots-lab/tools/audit.py --upstream playerbots-lab/upstream --current-manifest current-manifest.json --report-dir reports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arm64-webclient-compatibility
          path: |
            reports/compatibility-audit.json
            reports/compatibility-audit.md
          if-no-files-found: warn

  legacy-ws-bridge:
    name: Old WebSocket-to-TCP bridge isolated loopback tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Run bridge framing, routing, and loopback TCP echo tests
        run: python3 playerbots-lab/tools/test_wsbridge.py --upstream playerbots-lab/upstream --report-dir reports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-websocket-bridge-tests
          path: reports/wsbridge-loopback-tests.json
          if-no-files-found: warn

