<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Playerbots 3D World Lab</title>
<style>html,body{margin:0;overflow:hidden;background:#111b24;color:#fff;font:14px system-ui}canvas{display:block}#hud{position:fixed;top:12px;left:12px;background:#101a26bb;padding:10px 14px;border-radius:10px;pointer-events:none}#status{position:fixed;top:12px;right:12px;background:#101a26bb;padding:10px;border-radius:10px}#pad{position:fixed;bottom:24px;left:22px;display:grid;grid-template-columns:repeat(3,54px);gap:5px;touch-action:none}button{background:#243e57c9;color:white;border:1px solid #87a5b8;border-radius:10px;font-size:21px;height:54px;touch-action:none}#turn{position:fixed;bottom:30px;right:20px;display:flex;gap:8px}#turn button{width:62px}#msg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#101a26;padding:30px;text-align:center}</style></head><body>
<div id="hud"><b>PLAYERBOTS • 3D WORLD LAB</b><div id="pos">Konum: 0, 0</div><div id="fps">FPS: —</div><small>WASD / ok tuşları · Q/E kamera</small></div><div id="status">Yerel 3D prototip • AUTH/GAME yok</div>
<div id="pad"><span></span><button data-key="KeyW">▲</button><span></span><button data-key="KeyA">◀</button><button data-key="KeyS">▼</button><button data-key="KeyD">▶</button></div><div id="turn"><button data-key="KeyQ">↶</button><button data-key="KeyE">↷</button></div><div id="msg"></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x8eb8cf);scene.fog=new THREE.FogExp2(0x8eb8cf,.011);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,650);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xc7e9ff,0x526038,2));const sun=new THREE.DirectionalLight(0xffe7b9,2.5);sun.position.set(60,90,30);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-90;sun.shadow.camera.right=90;sun.shadow.camera.top=90;sun.shadow.camera.bottom=-90;scene.add(sun);
const height=(x,z)=>Math.sin(x*.045)*2.6+Math.cos(z*.06)*2.1+Math.sin((x+z)*.027)*1.8;
const size=240,steps=120;const geo=new THREE.PlaneGeometry(size,size,steps,steps);geo.rotateX(-Math.PI/2);const p=geo.attributes.position;for(let i=0;i<p.count;i++)p.setY(i,height(p.getX(i),p.getZ(i)));geo.computeVertexNormals();const terrain=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:0x668b4d,roughness:1}));terrain.receiveShadow=true;scene.add(terrain);
const rand=(seed)=>{let v=Math.sin(seed*127.1+311.7)*43758.5453;return v-Math.floor(v)};
const trunkMat=new THREE.MeshStandardMaterial({color:0x705039});const leafMat=new THREE.MeshStandardMaterial({color:0x2b6139,roughness:1});const stoneMat=new THREE.MeshStandardMaterial({color:0x89918a,roughness:1});
for(let i=0;i<160;i++){const x=(rand(i*3)-.5)*220,z=(rand(i*3+1)-.5)*220;if(Math.hypot(x,z)<13)continue;const y=height(x,z);if(i%5===0){const rock=new THREE.Mesh(new THREE.DodecahedronGeometry(1+rand(i)*1.7,0),stoneMat);rock.position.set(x,y+.5,z);rock.scale.set(1.4,.7,1);rock.castShadow=true;scene.add(rock)}else{const tree=new THREE.Group();const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.25,.4,3,7),trunkMat);trunk.position.y=1.5;tree.add(trunk);const crown=new THREE.Mesh(new THREE.ConeGeometry(2.1,5,8),leafMat);crown.position.y=4.8;tree.add(crown);tree.position.set(x,y,z);tree.scale.setScalar(.7+rand(i+9)*.8);tree.traverse(o=>{if(o.isMesh)o.castShadow=true});scene.add(tree)}}
const character=new THREE.Group();const armor=new THREE.MeshStandardMaterial({color:0x324e78,metalness:.55,roughness:.35});const skin=new THREE.MeshStandardMaterial({color:0xe4b98d});const metal=new THREE.MeshStandardMaterial({color:0xb8c5cd,metalness:.8,roughness:.25});
function part(g,m,x,y,z){const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.castShadow=true;character.add(o);return o}
part(new THREE.CapsuleGeometry(.43,.95,5,10),armor,0,1.55,0);part(new THREE.SphereGeometry(.35,12,10),skin,0,2.55,0);const leg1=part(new THREE.BoxGeometry(.32,.9,.36),armor,-.25,.55,0),leg2=part(new THREE.BoxGeometry(.32,.9,.36),armor,.25,.55,0);part(new THREE.BoxGeometry(.24,1.1,.25),metal,.65,1.5,0);part(new THREE.BoxGeometry(.24,1.1,.25),metal,-.65,1.5,0);const sword=part(new THREE.BoxGeometry(.1,1.5,.12),metal,.85,1.1,.25);sword.rotation.z=-.35;scene.add(character);
const keys=new Set();const aliases={ArrowUp:'KeyW',ArrowDown:'KeyS',ArrowLeft:'KeyA',ArrowRight:'KeyD'};addEventListener('keydown',e=>{keys.add(aliases[e.code]||e.code);if(e.code.startsWith('Arrow'))e.preventDefault()});addEventListener('keyup',e=>keys.delete(aliases[e.code]||e.code));addEventListener('blur',()=>keys.clear());document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys.add(k)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>keys.delete(k))});
let yaw=0,walk=0,frames=0,elapsed=0;const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);if(keys.has('KeyQ'))yaw+=dt*1.7;if(keys.has('KeyE'))yaw-=dt*1.7;let forward=Number(keys.has('KeyW'))-Number(keys.has('KeyS')),side=Number(keys.has('KeyD'))-Number(keys.has('KeyA'));const length=Math.hypot(forward,side);if(length){forward/=length;side/=length;const dx=(Math.sin(yaw)*forward+Math.cos(yaw)*side)*dt*8,dz=(Math.cos(yaw)*forward-Math.sin(yaw)*side)*dt*8;character.position.x=THREE.MathUtils.clamp(character.position.x+dx,-112,112);character.position.z=THREE.MathUtils.clamp(character.position.z+dz,-112,112);character.rotation.y=Math.atan2(dx,dz);walk+=dt*11;leg1.rotation.x=Math.sin(walk)*.5;leg2.rotation.x=-Math.sin(walk)*.5}else{leg1.rotation.x=leg2.rotation.x=0}character.position.y=height(character.position.x,character.position.z);const target=new THREE.Vector3(character.position.x-Math.sin(yaw)*12,character.position.y+8,character.position.z-Math.cos(yaw)*12);camera.position.lerp(target,Math.min(1,dt*6));camera.lookAt(character.position.x,character.position.y+1.6,character.position.z);renderer.render(scene,camera);frames++;elapsed+=dt;if(elapsed>=1){document.querySelector('#fps').textContent='FPS: '+Math.round(frames/elapsed);document.querySelector('#pos').textContent='Konum: '+character.position.x.toFixed(1)+', '+character.position.z.toFixed(1);frames=0;elapsed=0}}animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
